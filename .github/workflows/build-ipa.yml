name: Build iDared 32bit IPA

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: macos-15

    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_POLICY_DEFAULT_CMP0077: "NEW"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Patch AppPicker.swift (iOS Compatibility)
        run: |
          python3 - << 'EOF'
          import re

          path = "iphone/touchHLE/AppPicker.swift"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Suppression du bloc expérimental iOS 26 pour BarBackground
          p1 = r'if #available\(iOS 26, \*\) \{[\s\S]*?content\.glassEffect[\s\S]*?\} else \{([\s\S]*?)\n\s{8}\}'
          content = re.sub(p1, r'\1', content)

          # Suppression du bloc expérimental iOS 26 pour Button(role: .confirm)
          p2 = r'if #available\(iOS 26, \*\) \{[\s\S]*?Button\(role: \.confirm\)[\s\S]*?\} else \{([\s\S]*?)\n\s{20}\}'
          content = re.sub(p2, r'\1', content)

          # Validation stricte que les symboles incompatibles sont bien retirés
          assert "glassEffect" not in content, "Erreur patch : glassEffect est toujours présent !"
          assert "Button(role: .confirm)" not in content, "Erreur patch : Button(role: .confirm) est toujours présent !"

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AppPicker.swift patché avec succès : compatibilité iOS 16/17/18 assurée !")
          EOF

      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Configure iOS Linker & Fix Builtins
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK: $SDK_PATH"

          # Création du stub ___chkstk_darwin requis pour le runtime Rust sur iOS
          echo "void ___chkstk_darwin(void) {}" > chkstk.c
          xcrun --sdk iphoneos clang -c chkstk.c -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -o chkstk.o
          ar rcs "$RUNNER_TEMP/libchkstk.a" chkstk.o

          # Détection du runtime Clang Apple
          CLANG_RT=$(find "$(xcode-select -p)" -name "libclang_rt.builtins_ios.a" | head -n 1)

          RUST_LINK_FLAGS="-C link-arg=-isysroot -C link-arg=$SDK_PATH -C link-arg=-target -C link-arg=arm64-apple-ios16.0 -C link-arg=-Wl,-headerpad_max_install_names -C link-arg=$RUNNER_TEMP/libchkstk.a"
          if [ -n "$CLANG_RT" ]; then
            RUST_LINK_FLAGS="$RUST_LINK_FLAGS -C link-arg=$CLANG_RT"
          fi

          echo "CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS=$RUST_LINK_FLAGS" >> $GITHUB_ENV
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
          echo "CMAKE_POLICY_DEFAULT_CMP0077=NEW" >> $GITHUB_ENV

      - name: Precompile Rust Library
        run: |
          # Précompilation de la bibliothèque Rust pour valider les dépendances et alimenter le cache
          cargo build --release --target aarch64-apple-ios --lib

      - name: Build iOS App with Xcode
        run: |
          set -o pipefail
          xcodebuild build \
            -project iphone/touchHLE.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::Échec de la compilation Xcode. Affichage des erreurs détectées :"
              grep -E "(error:|fatal error:|\*\* BUILD FAILED \*\*)" xcodebuild.log -B 2 -A 5 || tail -n 80 xcodebuild.log
              exit 1
            }

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : bundle .app introuvable !"
            find build -name "*.app"
            exit 1
          fi
          echo "Application trouvée : $APP_PATH"

          # Signature ad-hoc (nécessaire pour LiveContainer, TrollStore, AltStore)
          if [ -f "iphone/touchHLE/touchHLE.entitlements" ]; then
            codesign --force --deep --sign - --entitlements "iphone/touchHLE/touchHLE.entitlements" "$APP_PATH"
          else
            codesign --force --deep --sign - "$APP_PATH"
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 iDared32bit.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-ipa
          path: iDared32bit.ipa
