name: Build iDared 32bit IPA

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build iOS App with Xcode
        run: |
          # Compiler l'application iOS complète via le projet Xcode natif.
          # Cela compile automatiquement touchHLE (Rust) via sa règle de build,
          # l'interface SwiftUI (AppPicker.swift), le wrapper UIKit (SDL_uikit_main.c)
          # et intègre toutes les ressources requises (polices, dylibs, assets).
          xcodebuild build \
            -project iphone/touchHLE.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : bundle .app introuvable !"
            find build -name "*.app"
            exit 1
          fi
          echo "Application trouvée : $APP_PATH"

          # Signature ad-hoc avec les entitlements (indispensable pour LiveContainer, TrollStore et AltStore)
          if [ -f "iphone/touchHLE/touchHLE.entitlements" ]; then
            codesign --force --deep --sign - --entitlements "iphone/touchHLE/touchHLE.entitlements" "$APP_PATH"
          else
            codesign --force --deep --sign - "$APP_PATH"
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 iDared32bit.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-ipa
          path: iDared32bit.ipa
